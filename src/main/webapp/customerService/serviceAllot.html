<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务分配</title>
    <link rel="stylesheet" href="../css/service-management.css">
</head>
<body>
<main class="page">
    <header class="page-header"><h1>服务分配</h1><p>销售主管将“新创建”的服务分配给状态正常的系统用户。</p></header>
    <div id="message" class="message"></div>
    <section class="panel">
        <form id="queryForm">
            <div class="form-grid">
                <div class="field"><label for="customerName">客户名称</label><input id="customerName"></div>
                <div class="field"><label for="title">概要</label><input id="title"></div>
                <div class="field"><label for="type">服务类型</label><select id="type"><option value="">全部</option></select></div>
                <div class="field"><label>状态</label><input value="新创建" disabled></div>
                <div class="field"><label for="startDate">创建日期起</label><input id="startDate" type="date"></div>
                <div class="field"><label for="endDate">创建日期止</label><input id="endDate" type="date"></div>
            </div>
            <div class="actions"><button type="submit">查询</button></div>
        </form>
    </section>
    <section class="panel">
        <div class="table-wrap">
            <table><thead><tr><th>编号</th><th>客户名称</th><th>概要</th><th>类型</th><th>创建人</th><th>创建时间</th><th>分配给</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table>
        </div>
        <div id="pager" class="pager"></div>
    </section>
</main>
<script src="../js/service-common.js"></script>
<script>
(function () {
    var page = 1;
    var metadata = {users: [], serviceTypes: []};

    async function loadMetadata() {
        metadata = (await ServiceApp.api('/metadata')).data;
        ServiceApp.setOptions(document.getElementById('type'), metadata.serviceTypes, '全部');
    }

    function userOptions() {
        return '<option value="">请选择</option>' + metadata.users.map(function (user) {
            return '<option value="' + user.userId + '">' + ServiceApp.esc(user.userName) + '</option>';
        }).join('');
    }

    async function load(targetPage) {
        page = targetPage || 1;
        try {
            var query = ServiceApp.params({customerName: ServiceApp.value('customerName'), title: ServiceApp.value('title'),
                type: ServiceApp.value('type'), status: '新创建', startDate: ServiceApp.value('startDate'),
                endDate: ServiceApp.value('endDate'), page: page, pageSize: 10});
            var result = (await ServiceApp.api('?' + query)).data;
            var rows = document.getElementById('rows');
            rows.innerHTML = result.items.length ? result.items.map(function (item) {
                return '<tr><td>' + item.svrId + '</td><td>' + ServiceApp.esc(item.svrCustName) + '</td><td>' + ServiceApp.esc(item.svrTitle) +
                    '</td><td><span class="badge">' + ServiceApp.esc(item.svrType) + '</span></td><td>' + ServiceApp.esc(item.svrCreateBy) +
                    '</td><td>' + ServiceApp.formatDate(item.svrCreateDate) + '</td><td><div class="inline-actions"><select id="user-' + item.svrId + '">' + userOptions() +
                    '</select><button onclick="allotService(' + item.svrId + ')">确定</button></div></td><td><button class="danger" onclick="deleteService(' + item.svrId + ')">删除</button></td></tr>';
            }).join('') : '<tr><td class="empty" colspan="8">没有待分配的服务</td></tr>';
            ServiceApp.renderPager(document.getElementById('pager'), result, load);
        } catch (error) { ServiceApp.message(error.message, false); }
    }

    window.allotService = async function (id) {
        var userId = Number(document.getElementById('user-' + id).value);
        if (!userId) { ServiceApp.message('请选择分配对象', false); return; }
        try {
            var response = await ServiceApp.api('/' + id + '/allot', {method: 'PUT', body: JSON.stringify({userId: userId})});
            ServiceApp.message(response.message, true); load(page);
        } catch (error) { ServiceApp.message(error.message, false); }
    };

    window.deleteService = async function (id) {
        if (!window.confirm('确定删除这条新创建的服务吗？')) return;
        try {
            var response = await ServiceApp.api('/' + id, {method: 'DELETE'});
            ServiceApp.message(response.message, true); load(page);
        } catch (error) { ServiceApp.message(error.message, false); }
    };

    document.getElementById('queryForm').addEventListener('submit', function (event) { event.preventDefault(); load(1); });
    loadMetadata().then(function () { load(1); }).catch(function (error) { ServiceApp.message(error.message, false); });
}());
</script>
</body>
</html>
