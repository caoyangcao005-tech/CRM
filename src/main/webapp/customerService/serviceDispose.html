<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务处理</title><link rel="stylesheet" href="../css/service-management.css">
</head>
<body>
<main class="page">
    <header class="page-header"><h1>服务处理</h1><p>客户经理查询分配给自己的服务，填写处理方法，系统自动记录处理人和处理时间。</p></header>
    <div id="message" class="message"></div>
    <section class="panel"><form id="queryForm">
        <div class="form-grid">
            <div class="field"><label for="customerName">客户名称</label><input id="customerName"></div>
            <div class="field"><label for="title">概要</label><input id="title"></div>
            <div class="field"><label for="type">服务类型</label><select id="type"><option value="">全部</option></select></div>
            <div class="field"><label>状态</label><input value="已分配" disabled></div>
            <div class="field"><label for="startDate">创建日期起</label><input id="startDate" type="date"></div>
            <div class="field"><label for="endDate">创建日期止</label><input id="endDate" type="date"></div>
        </div><div class="actions"><button type="submit">查询</button></div>
    </form></section>
    <section class="panel"><div class="table-wrap"><table>
        <thead><tr><th>编号</th><th>客户名称</th><th>概要</th><th>类型</th><th>创建人</th><th>创建时间</th><th>分配给</th><th>处理</th></tr></thead>
        <tbody id="rows"></tbody>
    </table></div><div id="pager" class="pager"></div></section>
</main>
<script src="../js/service-common.js"></script>
<script>
(function () {
    var page = 1;
    async function loadMetadata() {
        var data = (await ServiceApp.api('/metadata')).data;
        ServiceApp.setOptions(document.getElementById('type'), data.serviceTypes, '全部');
    }
    async function load(targetPage) {
        page = targetPage || 1;
        try {
            var query = ServiceApp.params({customerName: ServiceApp.value('customerName'), title: ServiceApp.value('title'),
                type: ServiceApp.value('type'), status: '已分配', startDate: ServiceApp.value('startDate'),
                endDate: ServiceApp.value('endDate'), onlyMine: true, page: page, pageSize: 10});
            var result = (await ServiceApp.api('?' + query)).data;
            document.getElementById('rows').innerHTML = result.items.length ? result.items.map(function (item) {
                return '<tr><td>' + item.svrId + '</td><td>' + ServiceApp.esc(item.svrCustName) + '</td><td>' + ServiceApp.esc(item.svrTitle) +
                    '</td><td><span class="badge">' + ServiceApp.esc(item.svrType) + '</span></td><td>' + ServiceApp.esc(item.svrCreateBy) +
                    '</td><td>' + ServiceApp.formatDate(item.svrCreateDate) + '</td><td>' + ServiceApp.esc(item.svrDueTo || '-') +
                    '</td><td><a class="button" href="serviceDisposeDialog.html?id=' + item.svrId + '">处理</a></td></tr>';
            }).join('') : '<tr><td class="empty" colspan="8">没有待处理的服务</td></tr>';
            ServiceApp.renderPager(document.getElementById('pager'), result, load);
        } catch (error) { ServiceApp.message(error.message, false); }
    }
    document.getElementById('queryForm').addEventListener('submit', function (event) { event.preventDefault(); load(1); });
    loadMetadata().then(function () { load(1); }).catch(function (error) { ServiceApp.message(error.message, false); });
}());
</script>
</body>
</html>
