<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户服务单</title><link rel="stylesheet" href="../css/service-management.css">
    <style>
        @media print {
            body { padding: 0; background: #fff; }
            .page-header { color: #000; background: #fff; border: 1px solid #999; }
            .no-print { display: none !important; }
            .panel { border: 0; box-shadow: none; }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="page-header"><h1>客户服务单</h1><p>客户关系管理系统 · 服务归档记录</p></header>
    <div id="message" class="message no-print"></div>
    <section class="panel"><h2 class="panel-title">完整服务信息</h2><div id="detail" class="detail-grid"><div class="empty">正在加载...</div></div>
        <div class="actions no-print"><button type="button" class="secondary" onclick="history.back()">返回</button><button id="printButton" type="button" onclick="window.print()" disabled>打印 / 输出服务单</button></div>
    </section>
</main>
<script src="../js/service-common.js"></script>
<script>
(function () {
    var id = ServiceApp.queryId();
    if (!id) { ServiceApp.message('服务编号无效', false); return; }
    ServiceApp.api('/' + id).then(function (response) {
        if (response.data.svrStatus !== '已归档') {
            ServiceApp.message('该服务尚未归档', false);
            return;
        }
        document.title = '客户服务单-' + response.data.svrId;
        document.getElementById('detail').innerHTML = ServiceApp.detailHtml(response.data);
        document.getElementById('printButton').disabled = false;
    }).catch(function (error) { ServiceApp.message(error.message, false); });
}());
</script>
</body>
</html>
